<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 PLOV Scalping Terminal v3.0</title>
    
    <!-- STYLES -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e17;
            color: #c8d6e5;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
        }
        
        #app {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 50px 1fr 200px;
            gap: 2px;
            height: 100vh;
            padding: 2px;
            background: #0d1520;
        }
        
        .panel {
            background: #111927;
            border: 1px solid #1a2a3a;
            border-radius: 4px;
            padding: 8px;
            overflow: hidden;
        }
        
        .panel-header {
            font-size: 11px;
            color: #4a6a8a;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #1a2a3a;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        
        #header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #111927;
            border-bottom: 1px solid #1a2a3a;
        }
        
        #header .title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }
        
        #header .status {
            font-size: 12px;
        }
        
        #header .controls button {
            background: #1a2a3a;
            border: 1px solid #2a4a5a;
            color: #c8d6e5;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        
        #header .controls button:hover {
            background: #2a4a5a;
        }
        
        #orderbook {
            grid-row: 2 / 4;
            overflow-y: auto;
        }
        
        #orderbook .order-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 2px 4px;
            position: relative;
        }
        
        #orderbook .order-row .depth-bar {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            opacity: 0.15;
            background: currentColor;
        }
        
        #orderbook .order-row.bid .price { color: #00ff88; }
        #orderbook .order-row.ask .price { color: #ff4444; }
        
        #price-panel {
            grid-column: 2;
            grid-row: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        
        #price-panel .price-item {
            text-align: center;
            padding: 4px;
            background: #0d1520;
            border-radius: 4px;
        }
        
        #price-panel .price-item .label {
            font-size: 10px;
            color: #4a6a8a;
        }
        
        #price-panel .price-item .value {
            font-size: 16px;
            font-weight: bold;
        }
        
        #price-panel .price-item .value.green { color: #00ff88; }
        #price-panel .price-item .value.red { color: #ff4444; }
        
        #chart {
            grid-column: 2;
            grid-row: 3;
            background: #0d1520;
        }
        
        #trades {
            grid-row: 2 / 4;
            overflow-y: auto;
            font-size: 12px;
        }
        
        #trades .trade-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 4px;
            border-bottom: 1px solid #0d1520;
        }
        
        #trades .trade-row.buy .price { color: #00ff88; }
        #trades .trade-row.sell .price { color: #ff4444; }
        
        #account {
            grid-column: 1;
            grid-row: 1;
            font-size: 12px;
        }
        
        #account .balance-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        
        #positions-orders {
            grid-column: 3;
            grid-row: 1;
            font-size: 12px;
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1520;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a2a3a;
            border-radius: 2px;
        }
        
        @media (max-width: 1024px) {
            #app {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div id="header">
            <div class="title">🚀 PLOV Scalping v3.0</div>
            <div class="status">
                <span id="status">🔄 Connecting...</span>
                <span style="margin-left:16px;color:#4a6a8a;">|</span>
                <span id="price" style="margin-left:16px;font-weight:bold;">$0.00</span>
            </div>
            <div class="controls">
                <button onclick="window.__state?.isTrading ? stopTrading() : startTrading()">
                    <span id="tradeBtn">▶ Start</span>
                </button>
                <button onclick="location.reload()">⟳</button>
            </div>
        </div>

        <!-- ACCOUNT -->
        <div id="account" class="panel">
            <div class="panel-header">📊 Account</div>
            <div class="balance-item"><span>Balance</span><span id="balance">$0.00</span></div>
            <div class="balance-item"><span>Equity</span><span id="equity">$0.00</span></div>
            <div class="balance-item"><span>P&L</span><span id="pnl">$0.00</span></div>
            <div class="balance-item"><span>P&L %</span><span id="pnlPercent">0.00%</span></div>
        </div>

        <!-- ORDERBOOK -->
        <div id="orderbook" class="panel">
            <div class="panel-header">📖 Order Book <span style="float:right;font-weight:normal;">
                <span id="bid" style="color:#00ff88;">0.00
